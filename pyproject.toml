[project]
name = "f10-custom-lane-segmentation"
version = "0.1.0"
description = "Custom lane-area U-Net trained from scratch for Assignment 10"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "pillow",
    "tensorboard",
    "matplotlib",
    "psutil",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
